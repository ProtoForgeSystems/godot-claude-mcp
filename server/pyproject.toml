[project]
name = "godot-claude-mcp"
version = "0.1.0"
description = "MCP server for controlling the Godot 4 editor via Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "websockets>=12.0",
]

[project.scripts]
godot-mcp = "godot_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["godot_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
